[project]
name = "dataanalyst-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rajgurubhosale", email = "rajguru007bhosale@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docker>=7.2.0",
    "fastapi>=0.146.0",
    "langchain-core>=1.6.12",
    "langchain-groq>=1.1.3",
    "langchain-tools>=0.1.34",
    "langgraph>=1.2.16",
    "langsmith>=0.14.11",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "state>=0.1.1.dev0",
    "streamlit>=1.66.0",
]

[project.scripts]
dataanalyst-agent = "dataanalyst_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
